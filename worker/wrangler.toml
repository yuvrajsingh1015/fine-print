name = "fine-print"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Model used for the deep check. Any Gemini Flash model that supports JSON output works.
[vars]
GEMINI_MODEL = "gemini-flash-lite-latest"

# Request counters for the per-IP rate limit (hashed IPs, expire after an hour).
# Create it with `npx wrangler kv namespace create RATE_LIMIT` and paste the id here.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "acbf04ca088e49aaa129cb8250e78ef9"

# No request logging.
[observability]
enabled = false
